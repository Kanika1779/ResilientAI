name: resilientai

services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Always point SQLite into the named volume, whatever .env says.
      DATABASE_URL: sqlite:////data/app.db
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    restart: unless-stopped
    networks: [app]

  frontend:
    build:
      context: ./frontend
      args:
        # Used by the *browser*, so localhost is correct here.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks: [app]

volumes:
  app_data:

networks:
  app:
